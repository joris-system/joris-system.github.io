<style>

  .days th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:4px 4px}
  .days td{padding:3px 4px;vertical-align:top}
  .days .in{min-height:34px;padding:5px 8px;font-size:13px}

  .prog button.on{background:var(--jor);border-color:var(--jor);color:#fff}
  .short{font-size:13px}
  .short b{color:var(--err)}
  .chart{width:100%;height:160px}
  .iss{cursor:pointer}
  table.gst tr.chk td{background:#FFF59D}
  table.gsf .in{min-width:70px}
  table.gsf td{padding:3px 4px}
  .paper.green{background:#CCF5CC;-webkit-print-color-adjust:exact;print-color-adjust:exact;padding:8mm;font-family:"Comic Sans MS","Segoe UI",sans-serif}
  .gs-title{text-align:center;font-size:18pt;font-weight:700;margin:0 0 4mm}
  .gs-head{border-collapse:collapse;margin:0 0 3mm;font-size:10.5pt}
  .gs-head th{text-align:left;font-weight:400;padding:2px 8px;border:1px solid #333;width:30mm}
  .gs-head td{border:1px solid #333;padding:2px 8px;min-width:80mm}
  .gs-grid{width:100%;border-collapse:collapse;font-size:10pt}
  .gs-grid th,.gs-grid td{border:1px solid #333;padding:3px 5px;text-align:left}
  .gs-grid td.c{text-align:center}
  .gs-grid tr.chk td{background:#FFF176}
