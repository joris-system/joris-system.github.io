<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#00A66E">
<title>Costing — JORIS</title>
<link rel="icon" href="../core/icon-192.png">
<link rel="stylesheet" href="../core/style.css?v=56cf0238">
<style>
  .wrap{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px}
  @media(max-width:1000px){.wrap{grid-template-columns:1fr}}
  .files{padding:12px;align-self:start;position:sticky;top:calc(70px + var(--look,0px));max-height:calc(100vh - 90px - var(--look,0px));overflow:auto}
  @media(max-width:1000px){.files{position:static;max-height:none}}
  .fl{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .fi{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;cursor:pointer}
  .fi.on{border-color:var(--jor);box-shadow:0 0 0 2px rgba(0,166,110,.18)}
  .fi b{display:block;font-size:13.5px}
  .vers{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
  .vers button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 11px;cursor:pointer;font-weight:600}
  .vers button.on{border-color:var(--jor);background:var(--mist-2)}
  table.lines{width:100%;border-collapse:collapse}
  table.lines th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
  table.lines td{padding:4px;border-bottom:1px solid var(--line-2);vertical-align:middle}
  table.lines .in{min-height:34px;padding:5px 8px;font-size:13px}
  table.lines td.lbl{min-width:220px}
  table.lines input.q{width:70px}
  table.lines input[data-money]{width:110px}
  table.lines tr.opt td{background:var(--gold-pale)}
  table.lines tr.kind td{background:var(--mist-3);font-weight:700;font-size:12px;color:var(--jor-dark)}
  .src{font-size:11px;color:var(--ink-3);display:block;margin-top:2px}
  .src.stale{color:var(--err);font-weight:700}
  .res td.big{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--jor-dark)}
  .set{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:0 12px}
  @media(max-width:700px){.set{grid-template-columns:1fr 1fr}}
  .pick{max-height:52vh;overflow:auto}
  .pick .log{cursor:pointer}
  .pick .log:hover{background:var(--mist-3)}
</style>
<script src="../core/door.js?v=4759b0df"></script>
</head>
<body>
<div class="page">
  <div class="head">
    <div><h2 class="ph">Costing</h2><p class="sub">Hotels from the pink sheet, visits and the rest from the rates list, the mark-up and the price per head — the same way for everyone.</p></div>
  </div>
  <div class="wrap">
    <div class="card files"><input class="in" id="fq" placeholder="Find a file…"><div class="fl" id="fl"></div></div>
    <div id="main"><div class="card pad empty">Pick a file.</div></div>
  </div>
</div>

<script src="../core/config.js?v=77767e31"></script>
<script src="../core/brand.js?v=805730c9"></script>
<script src="../core/rules.js?v=0ae4c2cd"></script>
<script src="../core/dates.js?v=9f278441"></script>
<script src="../core/costing.js?v=7a1e1d08"></script>
<script src="../core/sheet.js?v=e88c05fb"></script>
<script src="../core/api.js?v=ef448dd5"></script>
<script src="../core/ui.js?v=7c46d365"></script>
<script src="costing.js?v=9ca504b7"></script>
</body>
</html>
