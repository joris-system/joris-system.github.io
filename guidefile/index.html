<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#00A66E">
<title>Guide files — JORIS</title>
<link rel="icon" href="../core/icon-192.png">
<link rel="stylesheet" href="../core/style.css">
<style>
  .wrap{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px}
  @media(max-width:1000px){.wrap{grid-template-columns:1fr}}
  .gside{padding:12px;align-self:start;position:sticky;top:70px;max-height:calc(100vh - 90px);overflow:auto}
  @media(max-width:1000px){.gside{position:static;max-height:none}}
  .gl{display:flex;flex-direction:column;gap:6px}
  .gi{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;cursor:pointer}
  .gi.on{border-color:var(--jor);box-shadow:0 0 0 2px rgba(0,166,110,.18)}
  .gi b{display:block;font-size:13.5px}
  .gi .mini{display:block}
  .gi.closed{opacity:.6}
  .gside h4{margin:12px 2px 6px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
  .pane{display:flex;flex-direction:column;gap:14px;min-width:0}
  .access{display:grid;grid-template-columns:minmax(0,1fr) 160px;gap:16px;align-items:start}
  @media(max-width:700px){.access{grid-template-columns:1fr}}
  .code{font-size:34px;font-weight:800;letter-spacing:.14em;color:var(--jor-dark);font-family:Consolas,"Courier New",monospace}
  .link{font-size:13px;word-break:break-all;color:var(--ink-2);background:var(--mist-3);border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin:8px 0}
  .qr{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px}
  .qr svg{display:block;width:100%;height:auto}
  .drop{border:2px dashed #b9d3c7;border-radius:12px;padding:18px;text-align:center;color:var(--ink-2);background:var(--mist-3);cursor:pointer}
  .drop.over{border-color:var(--jor);background:var(--mist-2)}
  .drop b{color:var(--jor-deep)}
  .q{margin-top:10px;display:flex;flex-direction:column;gap:6px}
  .q div{display:flex;gap:8px;align-items:center;font-size:13px}
  .q .bad{color:var(--err)}
  table.docs{width:100%;border-collapse:collapse;margin-top:12px}
  table.docs th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);padding:6px;border-bottom:1px solid var(--line)}
  table.docs td{padding:6px;border-bottom:1px solid var(--line-2);vertical-align:top}
  table.docs tr.cat td{background:var(--mist-3);font-weight:700;font-size:12.5px;color:var(--jor-dark);padding:6px 8px}
  table.docs .in{min-height:34px;padding:5px 8px;font-size:13px}
  table.docs input.day,table.docs input.bk{width:64px}
  table.docs .acts{white-space:nowrap;display:flex;gap:4px;margin:0}
  .act{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid var(--line-2);font-size:13.5px}
  .act .t{flex:0 0 120px;color:var(--ink-3)}
  .act.guide b{color:var(--jor-dark)}
  .act.msg{background:var(--gold-pale)}
</style>
</head>
<body>
<div class="page">
  <div class="head">
    <div><h2 class="ph">Guide files</h2><p class="sub">The final itinerary, vouchers, rooming lists and guide notes, on the guide’s phone — working with no signal.</p></div>
  </div>
  <div class="wrap">
    <div class="card gside" id="glist"><div class="empty">Loading…</div></div>
    <div class="pane" id="pane"><div class="card pad empty">Pick a group.</div></div>
  </div>
</div>
<input type="file" id="pick" multiple class="hidden" accept=".pdf,.jpg,.jpeg,.png,.gif,.webp,.doc,.docx,.odt,.rtf,.txt,.xls,.xlsx,.ods,.csv,.ppt,.pptx,.odp">

<script src="../core/config.js"></script>
<script src="../core/brand.js"></script>
<script src="../core/rules.js"></script>
<script src="../core/dates.js"></script>
<script src="../core/qrcode.js"></script>
<script src="../core/api.js"></script>
<script src="../core/ui.js"></script>
<script src="guidefile.js"></script>
</body>
</html>
