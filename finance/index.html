<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; object-src 'none'; base-uri 'none'; form-action 'none'">

<title>Finance &amp; KPIs — JORIS</title>
<link rel="icon" href="../core/icon-192.png">
<link rel="stylesheet" href="../core/style.css?v=56cf0238">
<style>
  .fin-seasons{display:flex;gap:6px;flex-wrap:wrap}
  .fin-seasons button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font:600 13.5px var(--sans);color:var(--ink-2);cursor:pointer}
  .fin-seasons button.on{background:var(--jor);border-color:var(--jor);color:#fff}
  .fin-views{display:flex;border:1px solid var(--line);border-radius:99px;background:#fff;padding:3px;margin-right:6px}
  .fin-views button{border:0;background:none;border-radius:99px;padding:5px 14px;font:600 13.5px var(--sans);color:var(--ink-2);cursor:pointer}
  .fin-views button.on{background:#073A2B;color:#fff}

  /* The summary view: JOR's colours as a quilt across the top, a side panel, one big number a card */
  .fsum{position:relative;background:#F6F8F7;border-radius:24px;overflow:hidden;box-shadow:var(--shadow);padding:0 0 28px;min-height:760px}
  .sm-band{height:96px;display:grid;grid-template-columns:repeat(11,1fr)}
  .sm-band>i{display:block;position:relative;overflow:hidden}
  .sm-band>i.stripes{background:repeating-linear-gradient(135deg,#FFC81E 0 10px,#073A2B 10px 20px)}
  .sm-band .dots{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:space-evenly}.sm-band .dots span{width:13px;height:13px;border-radius:50%}
  .sm-side{position:absolute;left:16px;top:16px;bottom:16px;width:236px;background:#fff;border-radius:20px;box-shadow:0 8px 30px rgba(10,40,30,.08);display:flex;flex-direction:column;align-items:center;padding:24px 0 22px;z-index:2}
  .sm-logo{width:180px;height:54px;border-radius:14px;background:var(--jor);display:grid;place-items:center;color:#fff}.sm-logo img{height:34px}
  .sm-av{width:74px;height:74px;border-radius:50%;background:#073A2B;color:#FFC81E;display:grid;place-items:center;font-weight:800;font-size:24px;margin-top:30px;box-shadow:0 0 0 5px var(--mist-2)}
  .sm-hello{margin-top:16px;font-size:13.5px;color:var(--ink-3);text-align:center;line-height:1.5}.sm-hello b{display:block;color:var(--ink);font-size:15.5px}
  .sm-budget{margin-top:30px;text-align:center}.sm-budget b{display:block;font-size:28px;font-weight:600;letter-spacing:-.01em}.sm-budget span{font-size:13.5px;color:var(--ink-3)}
  .sm-nav{margin-top:34px;width:100%;padding:0 0 0 46px;display:flex;flex-direction:column;gap:20px}
  .sm-nav a{display:flex;align-items:center;gap:14px;font-size:14.5px;color:var(--ink-2);text-decoration:none}.sm-nav a:hover{color:var(--jor-dark)}
  .sm-nav a.on{color:var(--ink);font-weight:700}.sm-nav a.on svg{color:var(--jor)}
  .sm-full{margin-top:auto;border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 16px;font:600 13.5px var(--sans);color:var(--ink-2);cursor:pointer;display:flex;align-items:center;gap:8px}
  .sm-main{margin-left:300px;padding:30px 30px 0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px}
  .sm-row{display:flex;align-items:center;gap:8px}.sm-row .sp{flex:1}
  .sm-lbl{font-size:13.5px;color:var(--ink-3)}
  .sm-hero{background:#fff;border-radius:18px;box-shadow:0 14px 40px rgba(10,40,30,.08);padding:20px 22px 22px}
  .sm-big{font-size:56px;font-weight:500;letter-spacing:-.02em;line-height:1;margin-top:18px;font-variant-numeric:tabular-nums}.sm-big small{font-size:17px;color:var(--ink-3);font-weight:500;margin-left:8px;letter-spacing:0}
  .sm-meta{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:24px;font-size:14px;color:var(--ink-2)}.sm-meta b{color:var(--ink)}
  .sm-dots{margin-left:auto;display:flex}.sm-dots i{width:28px;height:28px;border-radius:50%;background:var(--jor)}.sm-dots i+i{margin-left:-10px;background:#FFC81E}
  .sm-bar{margin-top:22px;padding:0 4px;font-size:14px;color:var(--ink-2)}.sm-bar b{color:var(--ink)}.sm-bar em{font-style:normal;color:var(--ink-3)}
  .sm-track{margin-top:12px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}.sm-track i{display:block;height:100%;width:0;background:#073A2B;border-radius:3px;transition:width 1.1s cubic-bezier(.2,.7,.2,1)}
  .sm-pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
  .sm-mini{height:70px;border-radius:12px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 12px}
  .sm-mini.lift{border-color:transparent;box-shadow:0 10px 26px rgba(10,40,30,.08)}
  .sm-mini svg{width:52px;height:22px;flex:0 0 auto}.sm-mini div{text-align:right;flex:1;min-width:0}
  .sm-mini span{display:block;font-size:13px;color:var(--ink-3);white-space:nowrap}.sm-mini b{font-size:18px;font-weight:700}
  .sm-note{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink-3);margin:10px 2px 0}
  .sm-hd{display:flex;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}.sm-hd h3{margin:0;font-size:15.5px}
  .sm-hd .lnk{margin-left:auto;border:0;background:none;font:500 13.5px var(--sans);color:var(--ink-3);cursor:pointer}
  .sm-list{margin-top:30px}
  .sm-it{display:flex;align-items:center;gap:12px;margin-top:12px;text-decoration:none;color:inherit}
  .sm-it .ic{width:42px;height:42px;border-radius:10px;background:#fff;box-shadow:0 4px 14px rgba(10,40,30,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--jor-dark);line-height:1;flex:0 0 auto}
  .sm-it .ic em{font-style:normal;font-size:9.5px;font-weight:700;color:var(--ink-3);margin-top:2px;text-transform:uppercase}
  .sm-it .tx{flex:1;min-width:0}.sm-it .tx b{display:block;font-weight:500;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sm-it .tx small{font-size:12px;color:var(--ink-3)}
  .sm-it .pill{white-space:nowrap}.sm-it .chev{color:var(--ink-3);font-size:18px}
  .sm-map{position:relative;border-radius:18px;overflow:hidden;color:#fff;background:radial-gradient(120% 150% at 88% -10%,#1A8F67 0%,#0C5E44 36%,#073A2B 78%,#06302A 100%);padding:46px 6px 6px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sm-map .t{position:absolute;left:16px;top:12px;font-size:14px;font-weight:700;z-index:1}.sm-map .t span{display:block;font-size:11.5px;font-weight:500;color:#BFEBD8}
  .sm-people{margin-top:26px}
  .sm-faces{display:flex;gap:20px;margin-top:16px;padding-bottom:18px}
  .sm-faces i{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:15px;position:relative}
  .sm-faces i em{position:absolute;bottom:-19px;left:50%;transform:translateX(-50%);font-style:normal;font-size:11px;font-weight:700;color:var(--ink-3);white-space:nowrap}
  .sm-faces .f0{background:#073A2B;color:#FFC81E}.sm-faces .f1{background:var(--mist);color:var(--jor-dark)}.sm-faces .f2{background:#FFC81E;color:#073A2B}.sm-faces .f3{background:var(--mist-2);color:var(--jor-dark)}
  .sm-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:14px}
  .sm-tile{aspect-ratio:1/1;max-height:150px;border-radius:8px;padding:14px 16px;display:flex;flex-direction:column}
  .sm-tile b{font-size:19px;font-weight:600}.sm-tile small{font-size:12px;opacity:.85;margin-top:2px}.sm-tile span{margin-top:auto;font-size:14px;font-weight:600}
  @media (max-width:1100px){.sm-main{grid-template-columns:minmax(0,1fr)}}
  @media (max-width:900px){.sm-side{position:relative;z-index:2;left:auto;top:auto;bottom:auto;width:auto;margin:-40px 12px 0;padding:16px;flex-direction:row;flex-wrap:wrap;justify-content:center;gap:12px}
    .sm-side .sm-av{margin:0;width:52px;height:52px;font-size:18px}.sm-hello,.sm-budget{margin:0}.sm-nav,.sm-full{display:none}.sm-logo{display:none}
    .sm-main{margin-left:0;padding:22px 14px 0;gap:30px}.sm-band{height:70px}.sm-big{font-size:46px}}

  /* The season at a glance, over the map of where the work comes from */
  .hero{position:relative;border-radius:18px;overflow:hidden;color:#fff;margin:0 0 16px;box-shadow:var(--shadow);
    background:radial-gradient(120% 150% at 88% -10%,#1A8F67 0%,#0C5E44 36%,#073A2B 78%,#06302A 100%);-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .hero-in{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:4px 18px;align-items:center;padding:22px 24px 6px}
  .hero .eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#9FE3C6;font-weight:700;margin:0 0 8px}
  .hero .big{font-family:var(--serif);font-size:60px;line-height:.95;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .hero .big small{font-family:var(--sans);font-size:17px;font-weight:600;color:#BFEBD8;margin-left:8px;letter-spacing:0}
  .hero .lines{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px;margin:20px 0 10px}
  .hero .lines b{display:block;font-family:var(--serif);font-size:27px;line-height:1.05;font-variant-numeric:tabular-nums}
  .hero .lines em{display:block;font-style:normal;font-size:12px;color:#BFEBD8;margin-top:2px}
  .hero .src{font-size:11.5px;color:#8CCFB3;margin:6px 0 0;line-height:1.5}
  .map{position:relative;min-width:0}
  .map svg{display:block;width:100%;height:auto;overflow:visible}
  .map .land{fill:rgba(255,255,255,.085);stroke:rgba(255,255,255,.13);stroke-width:var(--sw,.4)}
  .map .mk{stroke:rgba(255,255,255,.4);stroke-width:var(--sw,.5);cursor:pointer;transition:fill .2s,fill-opacity .2s}
  .map .mk:hover{fill-opacity:1}
  .map .home{fill:#EFFFF7;stroke:#fff;stroke-width:var(--sw,.5)}
  .map .arc{fill:none;stroke:#FFC81E;stroke-opacity:.8;stroke-linecap:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.5s cubic-bezier(.2,.7,.2,1) forwards}
  .map .bub{fill:#FFC81E;stroke:#fff;cursor:pointer;transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .7s cubic-bezier(.2,1.5,.4,1) forwards}
  .map .bub.ring{fill:none;stroke:#FFC81E}
  .map .lbl{fill:#fff;font-family:var(--sans);font-weight:700;paint-order:stroke;stroke:#06302A;stroke-linejoin:round;pointer-events:none;opacity:0;animation:fade .6s ease forwards}
  .map .ie{fill:#fff}
  .map .pulse{fill:none;stroke:#fff;transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-out infinite}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes pop{to{transform:scale(1)}}
  @keyframes fade{to{opacity:1}}
  @keyframes pulse{0%{transform:scale(.5);opacity:.95}100%{transform:scale(3.4);opacity:0}}
  .tip{position:absolute;z-index:3;pointer-events:none;background:#fff;color:var(--ink);border-radius:10px;padding:8px 11px;font-size:12.5px;line-height:1.45;box-shadow:0 10px 26px rgba(0,0,0,.28);white-space:nowrap;transform:translate(-50%,calc(-100% - 12px));opacity:0;transition:opacity .12s}
  .tip.on{opacity:1}
  .tip b{display:block;font-size:13.5px}
  .maplegend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:#BFEBD8;padding:2px 24px 16px}
  .maplegend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}

  /* The cards */
  .kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:0 0 14px}
  .kpis.m4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px 13px;position:relative;overflow:hidden}
  .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--k,var(--jor))}
  .kpi .l{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
  .kpi .v{font-family:var(--serif);font-size:30px;font-weight:700;line-height:1.15;margin:4px 0 2px;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
  .kpi .s{font-size:12.5px;color:var(--ink-2)}
  .kpi .s b{color:var(--ink)}
  .kpi .late{color:var(--err);font-weight:700}
  .nomoney{display:flex;gap:12px;align-items:flex-start;background:var(--mist-3);border:1px dashed var(--mist);border-radius:14px;padding:12px 16px;margin:0 0 14px;font-size:13.5px;color:var(--ink-2)}
  .pace{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:linear-gradient(90deg,var(--mist-2),#fff);border:1px solid var(--mist);border-radius:14px;padding:11px 16px;margin:0 0 14px;font-size:14px}
  .pace .up{color:var(--jor-dark);font-weight:800}
  .pace .down{color:var(--err);font-weight:800}
  .grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin:0 0 14px}
  .fcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:0 0 14px;min-width:0}
  .grid2 .fcard{margin:0}
  .fcard h3{margin:0 0 2px;font-size:15.5px;display:flex;align-items:center;gap:8px}
  .fcard .why{font-size:12.5px;color:var(--ink-3);margin:0 0 12px}
  .cols{display:flex;align-items:flex-end;gap:8px;height:190px;padding:6px 2px 0;border-bottom:1px solid var(--line)}
  .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0;position:relative}
  .col .stack{width:100%;max-width:46px;height:0;display:flex;flex-direction:column-reverse;border-radius:6px 6px 0 0;overflow:hidden;transition:height .9s cubic-bezier(.2,.7,.2,1)}
  .col .b1{background:var(--jor)}
  .col .b2{background:repeating-linear-gradient(135deg,#f3dc9e 0 6px,#f8e9bf 6px 12px)}
  .col .amt{font-size:11px;color:var(--ink-2);margin-bottom:3px;white-space:nowrap}
  .xl{display:flex;gap:8px;padding:5px 2px 0}
  .xl span{flex:1;text-align:center;font-size:11.5px;color:var(--ink-3)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:8px}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
  .hb{display:grid;grid-template-columns:150px minmax(0,1fr) 92px 64px;gap:10px;align-items:center;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line-2)}
  .hb:last-child{border-bottom:0}
  .hb .tr{height:12px;background:var(--mist-3);border-radius:6px;overflow:hidden;position:relative}
  .hb .tr i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--jor);border-radius:6px;transition:width .9s cubic-bezier(.2,.7,.2,1)}
  .hb .tr i.soft{background:var(--mist)}
  .hb .tr i.gold{background:#E2A400}
  .hb .tr i.red{background:var(--err)}
  .hb .n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
  .hb .m{text-align:right;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .hb .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hb .lb em{font-style:normal;color:var(--ink-3)}
  .hb.ssn{grid-template-columns:70px minmax(0,1fr) 92px 190px}
  .funnel .st{display:flex;align-items:center;gap:12px;margin:0 0 8px}
  .funnel .st .fb{height:34px;width:0;border-radius:8px;background:var(--jor);color:#fff;display:flex;align-items:center;padding:0 12px;font-weight:700;font-size:13.5px;white-space:nowrap;min-width:max-content;transition:width .9s cubic-bezier(.2,.7,.2,1)}
  .funnel .st .fb.q{background:#2E8C69}
  .funnel .st .fb.c{background:var(--jor-dark)}
  .funnel .st .lbl2{font-size:12.5px;color:var(--ink-2)}
  .chips2{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .chips2 span{font-size:12.5px;background:var(--mist-3);border:1px solid var(--line-2);border-radius:99px;padding:3px 10px}
  table.ft{width:100%;border-collapse:collapse;font-size:13px}
  table.ft th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  table.ft td{padding:7px 8px;border-bottom:1px solid var(--line-2);white-space:nowrap}
  table.ft td.num,table.ft th.num{text-align:right;font-variant-numeric:tabular-nums}
  table.ft tr:last-child td{border-bottom:0}
  .mbar{display:inline-block;width:60px;height:7px;background:var(--mist-3);border-radius:4px;vertical-align:1px;margin-left:6px;overflow:hidden}
  .mbar i{display:block;height:100%;width:0;background:var(--jor);transition:width .9s cubic-bezier(.2,.7,.2,1)}
  .tw2{overflow-x:auto}
  .trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 12px}
  .trio div{background:var(--mist-3);border:1px solid var(--line-2);border-radius:10px;padding:9px 11px}
  .trio b{display:block;font-family:var(--serif);font-size:20px}
  .trio span{font-size:12px;color:var(--ink-3)}

  /* Operations: the groups coming in, and how far each has got */
  .opsl{display:flex;flex-direction:column;gap:6px}
  .opsr{display:grid;grid-template-columns:62px minmax(0,1fr) auto 112px;gap:12px;align-items:center;padding:8px 10px;border:1px solid var(--line-2);border-radius:12px;color:inherit;text-decoration:none}
  .opsr:hover{border-color:var(--mist);background:var(--mist-3)}
  .opsr .dt{text-align:center;line-height:1.05}
  .opsr .dt b{display:block;font-family:var(--serif);font-size:21px}
  .opsr .dt span{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
  .opsr .who{min-width:0}
  .opsr .who b{font-size:13.5px}
  .opsr .who div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ticks{display:flex;gap:4px}
  .ticks i{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:var(--mist-3);border:1px solid var(--line);font-style:normal;font-size:10.5px;font-weight:700;color:var(--ink-3)}
  .ticks i.on{background:var(--jor);border-color:var(--jor);color:#fff}
  .pw{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
  .pw .pb{flex:1;height:8px;background:var(--mist-3);border-radius:4px;overflow:hidden}
  .pw .pb i{display:block;height:100%;width:0;background:var(--jor);border-radius:4px;transition:width .9s cubic-bezier(.2,.7,.2,1)}
  .pw .pb i.amber{background:#E2A400}
  .pw .pb i.red{background:var(--err)}
  .foot2{font-size:12px;color:var(--ink-3);margin:6px 2px 30px;line-height:1.55}

  @media (max-width:1100px){.kpis,.kpis.m4{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media (max-width:900px){.hero-in{grid-template-columns:minmax(0,1fr);padding:18px 16px 4px}.hero .big{font-size:48px}.maplegend{padding:2px 16px 14px}}
  @media (max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}.hb{grid-template-columns:96px minmax(0,1fr) 70px 48px}.cols{gap:3px}.col .amt{display:none}
    .kpi .v{font-size:25px}.kpis,.kpis.m4{grid-template-columns:repeat(2,minmax(0,1fr))}
    .hb.ssn{grid-template-columns:48px minmax(0,1fr) 84px}.hb.ssn .m{grid-column:1/-1;text-align:left;margin-top:-2px}.opsr{grid-template-columns:50px minmax(0,1fr);gap:8px 10px}.opsr .ticks,.opsr .pw{grid-column:2}.ticks i{width:23px;height:23px}}
  @media (prefers-reduced-motion:reduce){.map .arc{animation:none;stroke-dashoffset:0}.map .bub{animation:none;transform:none}.map .lbl{animation:none;opacity:1}.map .pulse{animation:none;opacity:0}
    .col .stack,.hb .tr i,.mbar i,.pw .pb i,.funnel .st .fb{transition:none}}
  @media print{.top,.head .sp,#print,.fin-seasons button:not(.on){display:none !important}body{background:#fff}.fcard,.kpi,.hero{break-inside:avoid}
